name: PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [none, testpypi]
        default: none
  release:
    types: [published]

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that CMakeLists.txt and package.xml agree on the version
        run: |
          version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' CMakeLists.txt)"
          pkg="$(sed -nE 's|^[[:space:]]*<version>([0-9]+\.[0-9]+\.[0-9]+)</version>.*$|\1|p' package.xml)"
          if [ -z "$version" ] || [ "$version" != "$pkg" ]; then
            echo "::error::VERSION in CMakeLists.txt ($version) and package.xml ($pkg) differ"
            exit 1
          fi
      - name: Check that the release tag matches the project version
        if: github.event_name == 'release'
        run: |
          version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' CMakeLists.txt)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag v$tag does not match VERSION $version in CMakeLists.txt"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv build --sdist
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  test-sdist:
    name: Install sdist on ubuntu with system deps
    needs: sdist
    runs-on: ubuntu-latest
    container: "osgeo/gdal:ubuntu-full-3.6.3"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - run: bash ci/test_python_install_ubuntu.sh dist/*.tar.gz

  test-sdist-macos:
    name: Install sdist on macOS with brew deps
    needs: sdist
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Homebrew dependencies
        run: brew install gdal geos or-tools tbb tinyxml2 eigen
      - name: Install from sdist and test
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          CMAKE_PREFIX_PATH="$(brew --prefix)" /tmp/venv/bin/pip install dist/*.tar.gz
          /tmp/venv/bin/pip install pytest numpy
          /tmp/venv/bin/python -c "import fields2cover as f2c; print(f2c.__version__)"
          /tmp/venv/bin/python -m pytest tests/python -q

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [sdist, test-sdist, test-sdist-macos]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [sdist, test-sdist, test-sdist-macos]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
